<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oussama Space Game</title>
<style>
body{
    margin:0; background:black; font-family:Arial; color:white; overflow:hidden;
    user-select:none; -webkit-user-select:none; -ms-user-select:none;
    -webkit-touch-callout:none; touch-action:manipulation;
}
button, canvas{
    user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; touch-action:manipulation;
}
header{
    text-align:center; padding:10px; color:#00ccff; font-size:20px; text-shadow:0 0 10px #00ccff;
}
canvas{
    display:block; margin:0 auto; background:radial-gradient(circle,#000010,#000);
    border:2px solid #00ccff; border-radius:12px;
}
/* CONTROLS */
.controls{
    position:fixed; bottom:15px; left:0; width:100%; display:flex; justify-content:center;
    align-items:center; gap:18px; z-index:100; display:none;
}
.control-btn{
    width:95px; height:95px; font-size:42px; border:none; border-radius:25px;
    background:linear-gradient(145deg,#00ccff,#0077ff); color:white; font-weight:bold;
    box-shadow: 0 0 15px #00ccff, inset 0 0 10px rgba(255,255,255,0.3); transition:0.1s;
    display:flex; justify-content:center; align-items:center;
}
.control-btn:active{ transform:scale(0.92); }
.fire-btn{
    width:115px; height:115px; font-size:48px; border-radius:50%;
    background:linear-gradient(145deg,#ff5500,#ff0000);
    box-shadow: 0 0 20px red, inset 0 0 12px rgba(255,255,0.3);
}
/* START + GAME OVER SCREENS */
#startScreen, #gameOverScreen{
    position:fixed; top:0; left:0; width:100%; height:100%;
    background:rgba(0,0,0,0.9); display:flex; flex-direction:column;
    justify-content:center; align-items:center; text-align:center; z-index:200;
}
#gameOverScreen{ display:none; background:rgba(0,0,0,0.85); }
#startScreen h1{ color:#00ccff; font-size:48px; text-shadow:0 0 20px #00ccff; margin-bottom:10px; }
#gameOverScreen h1{ color:red; font-size:42px; text-shadow:0 0 20px red; }
#playBtn, #restartBtn{
    margin-top:20px; padding:18px 35px; font-size:24px; background:#00ccff;
    border:none; border-radius:15px; box-shadow:0 0 20px #00ccff; color:#000; font-weight:bold;
}
#playBtn:active, #restartBtn:active{ transform:scale(0.95); }
</style>
</head>
<body>
<header>🚀 Oussama Space Game</header>
<canvas id="game" width="350" height="500"></canvas>
<div class="controls">
    <button class="control-btn" onmousedown="leftStart()" onmouseup="stopMove()" ontouchstart="leftStart()" ontouchend="stopMove()">
        <svg width="42" height="42" viewBox="0 0 24 24" fill="white">
            <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
        </svg>
    </button>
    <button class="control-btn fire-btn" onclick="singleShot()" onmousedown="fireStart()" onmouseup="fireStop()" ontouchstart="fireStart()" ontouchend="fireStop()"> 🔥 </button>
    <button class="control-btn" onmousedown="rightStart()" onmouseup="stopMove()" ontouchstart="rightStart()" ontouchend="stopMove()">
        <svg width="42" height="42" viewBox="0 0 24 24" fill="white">
            <path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6z"/>
        </svg>
    </button>
</div>
<div id="startScreen">
    <h1>Oussama Space</h1>
    <p style="color:#ff4444; font-size:20px; text-shadow:0 0 8px red;">دمر الأعداء 💀</p>
    <button id="playBtn" onclick="startGame()">▶ PLAY</button>
</div>
<div id="gameOverScreen">
    <h1>GAME OVER</h1>
    <p id="finalScore" style="font-size:24px; margin:10px"></p>
    <button id="restartBtn" onclick="restart()">🔄 إعادة اللعب</button>
</div>
<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const W = 350; const H = 500;
let player, bullets, enemies, score, gameOver, gameStarted;
let moveDir = 0; let speed = 6;
let enemySpawnInterval;
let isFiring = false;
let fireRate = 8;
let fireTimer = 0;
let firedOnce = false;
// ===== BOSS =====
let boss = null;
let bossBullets = [];
let bossSpawned = false;
function init(){
    player = { x: 156, y: 400, w: 38, h: 55 };
    bullets = []; enemies = []; score = 0; gameOver = false; gameStarted = false; moveDir = 0;
    isFiring = false; fireTimer = 0; firedOnce = false;
    boss = null; bossBullets = []; bossSpawned = false;
    document.getElementById("gameOverScreen").style.display="none";
    document.querySelector(".controls").style.display="none";
    document.getElementById("startScreen").style.display="flex";
    clearInterval(enemySpawnInterval);
}
function startGame(){
    gameStarted = true;
    document.getElementById("startScreen").style.display="none";
    document.querySelector(".controls").style.display="flex";
    enemySpawnInterval = setInterval(()=>{
        if(!gameOver && gameStarted &&!boss){
            enemies.push({ x: Math.random()*(W-40), y: -40, speed: 2 + Math.random()*2.5 });
        }
    },1000);
}
init();
/* STARS */
let stars = [];
for(let i=0;i<70;i++){
    stars.push({ x:Math.random()*W, y:Math.random()*H, size:Math.random()*2+1 });
}
function drawStars(){
    for(let s of stars){
        ctx.fillStyle="white"; ctx.fillRect(s.x,s.y,s.size,s.size);
        s.y += 0.8; if(s.y > H){ s.y = 0; s.x = Math.random()*W; }
    }
}
/* ===== EPIC SPACESHIP V4 - صغيرة بمحركين ===== */
function drawPlayer(){
    let x = player.x; let y = player.y;
    let time = Date.now() * 0.005;
    for(let i = 0; i < 2; i++){
        let offsetX = [-8, 8][i];
        let flameSize = 28 + Math.sin(time * 4 + i) * 5;
        let flameGrad = ctx.createRadialGradient(x+19+offsetX, y+52, 2, x+19+offsetX, y+52, flameSize);
        flameGrad.addColorStop(0, "rgba(255,255,255,1)");
        flameGrad.addColorStop(0.3, "rgba(0,255,255,1)");
        flameGrad.addColorStop(1, "rgba(0,100,255,0)");
        ctx.fillStyle = flameGrad;
        ctx.beginPath();
        ctx.ellipse(x+19+offsetX, y+52, 4, flameSize, 0, 0, Math.PI*2);
        ctx.fill();
    }
    let shipGlow = ctx.createRadialGradient(x+19, y+25, 8, x+19, y+25, 35);
    shipGlow.addColorStop(0, "rgba(0,200,255,0.25)");
    shipGlow.addColorStop(1, "rgba(0,100,255,0)");
    ctx.fillStyle = shipGlow;
    ctx.beginPath();
    ctx.arc(x+19, y+30, 35, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 12; ctx.shadowColor = "#00ccff";
    let hullGrad = ctx.createLinearGradient(x+5, y, x+33, y+55);
    hullGrad.addColorStop(0, "#c0e0ff");
    hullGrad.addColorStop(0.5, "#0088ff");
    hullGrad.addColorStop(1, "#001a44");
    ctx.fillStyle = hullGrad;
    ctx.beginPath();
    ctx.moveTo(x+19, y-2);
    ctx.lineTo(x+6, y+12);
    ctx.lineTo(x+4, y+32);
    ctx.lineTo(x+10, y+48);
    ctx.lineTo(x+19, y+55);
    ctx.lineTo(x+28, y+48);
    ctx.lineTo(x+34, y+32);
    ctx.lineTo(x+32, y+12);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#0055aa";
    ctx.beginPath();
    ctx.moveTo(x+6, y+18);
    ctx.lineTo(x-4, y+25);
    ctx.lineTo(x-1, y+32);
    ctx.lineTo(x+8, y+28);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x+32, y+18);
    ctx.lineTo(x+42, y+25);
    ctx.lineTo(x+39, y+32);
    ctx.lineTo(x+30, y+28);
    ctx.closePath(); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = "#00ffff"; ctx.lineWidth = 1.2; ctx.shadowBlur = 6; ctx.shadowColor = "#00ffff";
    ctx.beginPath();
    ctx.moveTo(x+19, y+3); ctx.lineTo(x+19, y+48);
    ctx.moveTo(x+13, y+20); ctx.lineTo(x+25, y+20);
    ctx.stroke(); ctx.shadowBlur = 0;
    let cockpitGrad = ctx.createRadialGradient(x+19, y+15, 2, x+19, y+15, 9);
    cockpitGrad.addColorStop(0, "rgba(255,255,255,0.95)");
    cockpitGrad.addColorStop(0.5, "rgba(0,255,255,0.7)");
    cockpitGrad.addColorStop(1, "rgba(0,100,255,0.4)");
    ctx.fillStyle = cockpitGrad;
    ctx.beginPath();
    ctx.ellipse(x+19, y+15, 7, 11, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 8; ctx.shadowColor = "#00ffff";
    ctx.fillStyle = "#003366";
    ctx.fillRect(x+2, y+28, 3, 14);
    ctx.fillRect(x+33, y+28, 3, 14);
    ctx.fillStyle = "#00ffff";
    ctx.beginPath(); ctx.arc(x+3.5, y+42, 2.5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(x+34.5, y+42, 2.5, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
}
/* ===== AWESOME BLUE LASERS ===== */
function drawBullets(){
    for(let i=0;i<bullets.length;i++){
        let b = bullets[i]; b.y -= 12;
        ctx.shadowBlur = 25; ctx.shadowColor = "#00ccff";
        let laser = ctx.createLinearGradient( b.x, b.y, b.x, b.y+26 );
        laser.addColorStop(0,"#ffffff"); laser.addColorStop(0.2,"#66ffff");
        laser.addColorStop(0.6,"#00ccff"); laser.addColorStop(1,"#0044ff");
        ctx.fillStyle = laser; ctx.beginPath(); ctx.roundRect(b.x,b.y,7,24,4); ctx.fill();
        ctx.fillStyle = "rgba(255,255,255,0.9)"; ctx.beginPath(); ctx.roundRect(b.x+2,b.y+2,3,18,2); ctx.fill();
        ctx.fillStyle = "#ffffff"; ctx.beginPath(); ctx.arc(b.x+3.5,b.y,4,0,Math.PI*2); ctx.fill();
        ctx.fillStyle = "rgba(0,200,255,0.35)";
        ctx.beginPath(); ctx.moveTo(b.x+1,b.y+24); ctx.lineTo(b.x+6,b.y+24); ctx.lineTo(b.x+3.5,b.y+36); ctx.closePath(); ctx.fill();
        ctx.shadowBlur = 0;
        if(b.y < -40){ bullets.splice(i,1); i--; }
    }
}
/* ALIEN */
function drawAlien(x,y,scale=1){
    ctx.save();
    ctx.scale(scale, scale);
    x = x/scale; y = y/scale;
    ctx.shadowBlur = 20; ctx.shadowColor = "#39ff14";
    let grad = ctx.createLinearGradient(x,y,x+40,y+40);
    grad.addColorStop(0,"#7CFF00"); grad.addColorStop(1,"#00AA44");
    ctx.fillStyle = grad; ctx.beginPath(); ctx.ellipse(x+20,y+20,22,12,0,0,Math.PI*2); ctx.fill();
    let dome = ctx.createRadialGradient( x+20, y+12, 2, x+20, y+12, 12 );
    dome.addColorStop(0,"#aaffff"); dome.addColorStop(1,"#0066ff");
    ctx.fillStyle = dome; ctx.beginPath(); ctx.arc(x+20,y+12,10,Math.PI,0); ctx.fill();
    ctx.fillStyle="black"; ctx.beginPath(); ctx.arc(x+14,y+18,2,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(x+26,y+18,2,0,Math.PI*2); ctx.fill();
    ctx.fillStyle="#00ffff"; for(let i=0;i<5;i++){ ctx.beginPath(); ctx.arc(x+6+i*7,y+25,2,0,Math.PI*2); ctx.fill(); }
    ctx.shadowBlur = 0;
    ctx.restore();
}
/* BOSS - أحمر فقط */
function drawBoss(){
    if(!boss) return;
    let x = boss.x; let y = boss.y;
    if(boss.entering){
        boss.y += 1.5;
        if(boss.y >= 50){
            boss.y = 50;
            boss.entering = false;
        }
    } else {
        boss.x += boss.dir * 2;
        if(boss.x <= 0 || boss.x >= W-80){ boss.dir *= -1; }
        boss.fireTimer++;
        if(boss.fireTimer >= 90){
            bossBullets.push({ x: boss.x+40, y: boss.y+40 });
            boss.fireTimer = 0;
        }
    }
    // رسم الزعيم أحمر
    let scale = 2;
    ctx.save();
    ctx.scale(scale, scale);
    x = x/scale; y = y/scale;
    ctx.shadowBlur = 30; ctx.shadowColor = "#ff0000";
    let grad = ctx.createLinearGradient(x,y,x+40,y+40);
    grad.addColorStop(0,"#ff4444"); grad.addColorStop(1,"#aa0000");
    ctx.fillStyle = grad; ctx.beginPath(); ctx.ellipse(x+20,y+20,22,12,0,0,Math.PI*2); ctx.fill();
    let dome = ctx.createRadialGradient( x+20, y+12, 2, x+20, y+12, 12 );
    dome.addColorStop(0,"#ffaaaa"); dome.addColorStop(1,"#ff0000");
    ctx.fillStyle = dome; ctx.beginPath(); ctx.arc(x+20,y+12,10,Math.PI,0); ctx.fill();
    ctx.fillStyle="black"; ctx.beginPath(); ctx.arc(x+14,y+18,2,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(x+26,y+18,2,0,Math.PI*2); ctx.fill();
    ctx.fillStyle="#ffff00"; for(let i=0;i<5;i++){ ctx.beginPath(); ctx.arc(x+6+i*7,y+25,2,0,Math.PI*2); ctx.fill(); }
    ctx.shadowBlur = 0;
    ctx.restore();

    let hpPercent = boss.hp / boss.maxHp;
    ctx.fillStyle = "#330000";
    ctx.fillRect(boss.x+10, boss.y-15, 60, 8);
    ctx.fillStyle = hpPercent > 0.5? "#00ff00" : hpPercent > 0.2? "#ffff00" : "#ff0000";
    ctx.fillRect(boss.x+10, boss.y-15, 60*hpPercent, 8);
    ctx.strokeStyle = "#fff";
    ctx.strokeRect(boss.x+10, boss.y-15, 60, 8);
}
/* BOSS BULLETS */
function drawBossBullets(){
    for(let i=0;i<bossBullets.length;i++){
        let b = bossBullets[i]; b.y += 5;
        ctx.shadowBlur = 15; ctx.shadowColor = "#ff0000";
        ctx.fillStyle = "#ff0000";
        ctx.fillRect(b.x-2, b.y, 4, 20);
        ctx.fillStyle = "#ffff00";
        ctx.fillRect(b.x-1, b.y, 2, 15);
        ctx.shadowBlur = 0;
        if(b.x < player.x + player.w && b.x + 4 > player.x && b.y < player.y + player.h && b.y + 20 > player.y){
            endGame();
        }
        if(b.y > H){ bossBullets.splice(i,1); i--; }
    }
}
/* ENEMIES */
function drawEnemies(){
    for(let i=0;i<enemies.length;i++){
        let e = enemies[i]; e.y += e.speed; drawAlien(e.x,e.y);
        if( e.x < player.x + player.w && e.x + 40 > player.x && e.y < player.y + player.h && e.y + 30 > player.y ){
            endGame();
        }
        if(e.y > H){ enemies.splice(i,1); i--; }
    }
}
/* COLLISION */
function collision(){
    for(let i=0;i<enemies.length;i++){
        for(let j=0;j<bullets.length;j++){
            let e = enemies[i]; let b = bullets[j];
            if( b.x < e.x+40 && b.x+7 > e.x && b.y < e.y+30 && b.y+24 > e.y ){
                enemies.splice(i,1); bullets.splice(j,1); score += 10; i--; break;
            }
        }
    }
    if(boss){
        for(let j=0;j<bullets.length;j++){
            let b = bullets[j];
            if( b.x < boss.x+80 && b.x+7 > boss.x && b.y < boss.y+60 && b.y+24 > boss.y ){
                bullets.splice(j,1);
                boss.hp--;
                if(boss.hp <= 0){
                    score += 500;
                    boss = null;
                    bossBullets = [];
                }
                break;
            }
        }
    }
}
/* SPAWN BOSS */
function checkBossSpawn(){
    if(score >= 1000 &&!bossSpawned &&!boss){
        bossSpawned = true;
        boss = { x: W/2-40, y: -80, hp: 100, maxHp: 100, dir: 1, fireTimer: 0, entering: true };
        enemies = [];
    }
}
/* GAME OVER */
function endGame(){
    gameOver = true; clearInterval(enemySpawnInterval); isFiring = false;
    document.getElementById("finalScore").innerText = "Score: " + score;
    document.getElementById("gameOverScreen").style.display="flex";
    document.querySelector(".controls").style.display="none";
}
function restart(){ init(); }
/* CONTROLS */
function leftStart(){ if(gameStarted) moveDir = -1; }
function rightStart(){ if(gameStarted) moveDir = 1; }
function stopMove(){ moveDir = 0; }
function shoot(){
    if(gameOver ||!gameStarted) return;
    bullets.push({ x: player.x + 16, y: player.y });
}
function singleShot(){
    if(firedOnce) return;
    shoot();
}
function fireStart(){
    if(gameOver ||!gameStarted) return;
    isFiring = true;
    firedOnce = false;
    shoot();
    setTimeout(()=>{ firedOnce = true; }, 150);
}
function fireStop(){ isFiring = false; firedOnce = false; }
/* KEYBOARD */
document.addEventListener("keydown",(e)=>{
    if(!gameStarted) return;
    if(e.key==="ArrowLeft") moveDir = -1;
    if(e.key==="ArrowRight") moveDir = 1;
    if(e.key===" " &&!isFiring){ fireStart(); }
});
document.addEventListener("keyup",(e)=>{
    if(e.key==="ArrowLeft" || e.key==="ArrowRight") moveDir = 0;
    if(e.key===" ") fireStop();
});
/* LOOP */
function loop(){
    ctx.clearRect(0,0,W,H); drawStars();
    if(gameStarted &&!gameOver){
        player.x += moveDir * speed;
        if(player.x < 0) player.x = 0;
        if(player.x > W-player.w) player.x = W-player.w;
        if(isFiring){
            fireTimer++;
            if(fireTimer >= fireRate){
                shoot();
                fireTimer = 0;
            }
        }
        checkBossSpawn();
        drawPlayer(); drawBullets(); drawEnemies(); drawBoss(); drawBossBullets(); collision();
    }
    ctx.fillStyle="white"; ctx.font="18px Arial"; ctx.fillText("Score: "+score,10,20);
    if(boss) ctx.fillText("BOSS HP: "+boss.hp,10,45);
    requestAnimationFrame(loop);
}
loop();
</script>
</body>
  </html>
